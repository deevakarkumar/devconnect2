# render.yaml — Deploy DevConnect to Render.com
# https://render.com/docs/blueprint-spec

services:
  # ── Backend API (Node.js) ─────────────────────────────────────────────────
  - type: web
    name: devconnect-server
    runtime: node
    region: oregon
    plan: free          # upgrade to starter ($7/mo) for always-on
    rootDir: server
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: devconnect-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://devconnect-client.onrender.com   # update after first deploy
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        value: https://devconnect-server.onrender.com/api/auth/github/callback
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # ── Frontend (Vite static site) ───────────────────────────────────────────
  - type: web
    name: devconnect-client
    runtime: static
    region: oregon
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /api/*
        destination: https://devconnect-server.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://devconnect-server.onrender.com

  # ── PostgreSQL Database ────────────────────────────────────────────────────
databases:
  - name: devconnect-db
    region: oregon
    plan: free          # 1 GB, 90-day expiry on free tier — upgrade for production
    databaseName: devconnect
    user: devconnect
